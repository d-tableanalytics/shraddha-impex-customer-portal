# The customer portal itself: static SPA + API proxy. Installed to
# /etc/nginx/snippets/shraddha-impex-app.conf and included by every server block
# in sites-available/shraddha-impex.
#
# This lives apart from the server blocks on purpose. certbot rewrites the site
# file when it issues and renews, so the deploy workflow must never overwrite it
# — it syncs THIS file instead. Everything that changes with the app is here;
# everything certbot touches is there.

root /var/www/shraddha-impex/frontend/dist;
index index.html;

# Excel imports go through /api/v1/inventory; Express itself accepts 10mb
# bodies, so nginx must not cut them off below that.
#
# Raised to 30m for product images: /api/v1/product-details accepts up to 20
# files of 5 MB each in one bulk upload, and nginx is what actually bounds a
# batch — the per-file limit says nothing about the total. A request over this
# is refused by nginx before Express sees it, which surfaces as a bare 413 with
# no JSON body, so the number here is the one the admin screen's guidance has to
# agree with.
client_max_body_size 30m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Vite fingerprints everything under /assets, so those URLs are immutable.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# index.html must never be cached, or browsers keep loading the old bundle after
# a deploy and request asset hashes that no longer exist.
location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
}

location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Express reads this to build absolute URLs and to trust the connection as
    # secure; without it the app believes every HTTPS request arrived on HTTP.
    proxy_set_header X-Forwarded-Proto $scheme;
    # Excel exports of a full inventory can outrun the 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

location = /health {
    proxy_pass http://127.0.0.1:4000/health;
    access_log off;
}

# React Router owns the URL space: /login and every other route is the SPA
# shell, not a file on disk and not a 404.
location / {
    try_files $uri $uri/ /index.html;
}
