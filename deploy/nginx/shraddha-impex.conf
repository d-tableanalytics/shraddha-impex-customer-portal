# Server blocks for the customer portal. Canonical URL:
#
#   https://erp.shraddhaimpex.net
#
# This file is the BOOTSTRAP copy — what you install by hand on a fresh box
# before running certbot. Once certbot has issued, the live copy at
# /etc/nginx/sites-available/shraddha-impex carries TLS directives that are not
# reproduced here, so DO NOT let the deploy workflow overwrite it. Deploys sync
# deploy/nginx/shraddha-impex-app.conf into /etc/nginx/snippets/ instead; all
# app configuration lives there and is shared by every block below.
#
# To install on a fresh host:
#   sudo cp deploy/nginx/shraddha-impex-app.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/shraddha-impex.conf /etc/nginx/sites-available/shraddha-impex
#   sudo ln -s /etc/nginx/sites-available/shraddha-impex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.shraddhaimpex.net
#
# $connection_upgrade comes from the shared map in
# /etc/nginx/conf.d/websocket_upgrade.conf.

# Canonical vhost. certbot converts this to :443 with TLS and adds its own :80
# block that redirects here.
server {
    listen 80;
    server_name erp.shraddhaimpex.net;

    access_log /var/log/nginx/shraddha-impex.access.log;
    error_log  /var/log/nginx/shraddha-impex.error.log;

    include snippets/shraddha-impex-app.conf;
}

# The port this app was first published on, kept alive so existing bookmarks and
# anything already pointing at the bare IP still land somewhere useful. It only
# redirects: serving the SPA here too would split logins across two origins,
# because localStorage — where the JWT is kept — is per-origin.
server {
    listen 4003;
    server_name _;

    return 301 https://erp.shraddhaimpex.net$request_uri;
}
