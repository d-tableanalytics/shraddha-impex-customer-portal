# Shraddha Impex customer portal.
#
#   :4003  this vhost — serves the built SPA and proxies the API to the backend
#   :4000  the Express/Socket.IO backend (PM2 "shraddha-backend")
#
# The SPA is served same-origin: the browser calls /api/v1/... on :4003 and nginx
# forwards it to :4000. That keeps CORS out of the picture for normal traffic and
# means TLS later only has to cover one port.
#
# $connection_upgrade comes from the shared map in
# /etc/nginx/conf.d/websocket_upgrade.conf.

server {
    listen 4003;
    server_name 32.236.114.49 _;

    root /var/www/shraddha-impex/frontend/dist;
    index index.html;

    # Excel imports go through /api/v1/inventory; Express itself accepts 10mb
    # bodies, so nginx must not cut them off below that.
    client_max_body_size 20m;

    access_log /var/log/nginx/shraddha-impex.access.log;
    error_log  /var/log/nginx/shraddha-impex.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets, so those URLs are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading the old bundle
    # after a deploy and request asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel exports of a full inventory can outrun the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # React Router owns the URL space: any path that is not a real file is the
    # SPA shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
