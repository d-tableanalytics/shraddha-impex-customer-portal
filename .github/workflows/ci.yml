name: CI

# Runs on every branch and PR. The deploy workflow re-runs the same frontend
# build before shipping, so a green CI here means main is deployable.
on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0.
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          # Literal, not a secret — it is the public site URL, and holding it as
          # a secret only meant CI could build against an empty value if it went
          # missing. Keep in step with deploy.yml.
          VITE_API_URL: https://erp.shraddhaimpex.net
        run: npm run build

  backend:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # There is no test suite yet. Parsing every module at least catches syntax
      # errors and bad imports before they reach PM2, where the only symptom is a
      # restart loop. Replace this with `npm test` once tests exist.
      - name: Syntax check
        working-directory: backend
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
