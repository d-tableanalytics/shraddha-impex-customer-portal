name: Deploy to EC2

# Ships main to the EC2 box: nginx serves frontend/dist over HTTPS at
# erp.shraddhaimpex.net, PM2 runs the backend on :4000.
#
# The frontend is built HERE, not on the server. That box runs ~15 other
# production apps on 3.7 GB with no swap, so a Vite build there risks the kernel
# OOM killer taking down a neighbouring app. The runner has memory to spare.
#
# EC2_SSH_KEY is the ONLY secret this workflow needs. The host, the login name
# and the site URL are all public facts, and every one of them held as a secret
# was another thing that could be quietly missing or mistyped while the failure
# surfaced as an unrelated SSH error. They are literals below — read them, fix
# them here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave a git reset with an rsync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  EC2_HOST: 32.236.114.49
  EC2_USER: ubuntu
  APP_DIR: /var/www/shraddha-impex
  SITE_URL: https://erp.shraddhaimpex.net
  # Baked into the bundle at build time; must equal the origin the SPA is served
  # from, or every API call becomes cross-origin and CORS rejects it.
  VITE_API_URL: https://erp.shraddhaimpex.net

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked before the build so a missing secret costs seconds, not the two
      # minutes of npm ci it used to sit behind.
      - name: Preflight — SSH key present and usable
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret EC2_SSH_KEY is empty or not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, as the full" \
                 "contents of erp-p-2.pem including the BEGIN and END lines."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr -d '\r': a key pasted from a Windows editor arrives with CRLF
          # line endings, and OpenSSH rejects that with "invalid format" — which
          # reads like a wrong key rather than a wrong newline.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a valid private key. Most likely it" \
                 "was pasted partially — it must include the -----BEGIN----- and" \
                 "-----END----- lines and every line between them."
            exit 1
          fi
          echo "key parsed OK"

      - name: Preflight — can reach the server
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan got nothing from $EC2_HOST:22 — the host is" \
                 "unreachable from GitHub's runners. Check the EC2 security group" \
                 "allows inbound 22 from 0.0.0.0/0."
            exit 1
          fi
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                 "$EC2_USER@$EC2_HOST" true; then
            echo "::error::Key is valid but $EC2_USER@$EC2_HOST rejected it." \
                 "Confirm EC2_SSH_KEY is the key whose public half is in" \
                 "/home/$EC2_USER/.ssh/authorized_keys on the box."
            exit 1
          fi
          echo "SSH to $EC2_USER@$EC2_HOST OK"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Fail if the build produced nothing
        run: test -s frontend/dist/index.html

      - name: Update backend and install dependencies
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            APP_DIR="$APP_DIR" bash -euo pipefail <<'REMOTE'
            cd "$APP_DIR"
            git fetch --all --prune
            # reset, not pull: the server tree is a deploy target, not a
            # workspace. Ignored files (backend/.env, node_modules) are untouched.
            git reset --hard origin/main
            echo "server now at: $(git log --oneline -1)"
            cd backend
            npm ci --omit=dev
          REMOTE

      - name: Upload frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            frontend/dist/ "$EC2_USER@$EC2_HOST:$APP_DIR/frontend/dist/"

      - name: Reload services
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            APP_DIR="$APP_DIR" bash -euo pipefail <<'REMOTE'
            cd "$APP_DIR"
            pm2 startOrReload ecosystem.config.cjs --only shraddha-backend --update-env
            pm2 save
            # Sync the app snippet only. sites-available/shraddha-impex holds
            # certbot's TLS directives and its http->https redirect; copying the
            # repo's bootstrap copy over it would strip the certificate config
            # and break HTTPS on every deploy.
            if ! sudo cmp -s deploy/nginx/shraddha-impex-app.conf /etc/nginx/snippets/shraddha-impex-app.conf; then
              sudo cp deploy/nginx/shraddha-impex-app.conf /etc/nginx/snippets/shraddha-impex-app.conf
              sudo nginx -t && sudo systemctl reload nginx
              echo "nginx snippet updated and reloaded"
            fi
          REMOTE

      - name: Health check
        run: |
          # Check through the public hostname, not the backend port: that
          # exercises DNS, the certificate and the nginx proxy as well as the
          # app, which is what "is it up" actually means for a user.
          #
          # The backend reconnects to Atlas and runs its boot jobs before it
          # listens, so give it room before calling the deploy bad.
          for i in $(seq 1 20); do
            if curl -fsS -m 10 "$SITE_URL/health" > /dev/null; then
              echo "backend healthy"
              curl -fsS -m 10 -o /dev/null "$SITE_URL/login" && echo "frontend healthy"
              exit 0
            fi
            echo "attempt $i: not up yet"
            sleep 6
          done
          echo "::error::backend did not become healthy within ~2 minutes"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "pm2 logs shraddha-backend --lines 40 --nostream" || true
          exit 1

      - name: Confirm what landed
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "cd $APP_DIR && git log --oneline -1" || true
